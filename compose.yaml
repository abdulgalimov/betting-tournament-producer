name: betting-test-producer

services:
  test-producer:
    image: betting-test-producer:local
    build: .
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 30s
    environment:
      PORT: '3001'
      RABBITMQ_URL: ${RABBITMQ_DOCKER_URL:-amqp://tournament:tournament@host.docker.internal:5672}
      PUBLISH_TIMEOUT_MS: ${PUBLISH_TIMEOUT_MS:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['127.0.0.1:3001:3001']
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
